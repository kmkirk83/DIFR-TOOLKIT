name: Android debug APK

# Manual only. Public-repo GitHub-hosted minutes are included at no extra charge
# within GitHub's Free plan quota. This workflow does not use larger runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pins are full commits. Tags: checkout v4.2.2, setup-python v5.6.0,
      # setup-java v4.7.1, setup-android v3.2.2, setup-gradle v4.4.1,
      # upload-artifact v4.6.2.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Kit unit tests
        working-directory: kit
        run: python3 -m unittest tests.test_core -v | tee "$RUNNER_TEMP/kit-tests.txt"

      - name: Confirm embedded kit matches kit/dfir_kit.py
        run: cmp kit/dfir_kit.py android/app/src/main/python/dfir_kit.py

      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96

      - name: Lint and debug APK
        working-directory: android
        run: ./gradlew :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: Upload kit test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kit-test-log
          path: ${{ runner.temp }}/kit-tests.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: difr-toolkit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
